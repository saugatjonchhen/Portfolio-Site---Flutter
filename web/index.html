<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="portfolio">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>portfolio</title>
    <link rel="manifest" href="manifest.json">
</head>
<body style="overflow: hidden;">
<div id="loading_indicator" class="loading-container">
    <div class="loader-content">
        <div class="glow-ring"></div>
        <div class="logo-text">P</div>
    </div>
    <div class="loading-bar-container">
        <div class="loading-bar"></div>
    </div>
    <h1 class="loading-text">Initializing Portfolio...</h1>
</div>

<style>
    /* Match your AppTheme.backgroundDark (0xFF0F172A) */
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
    }

    .loading-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif; /* Matches your theme */
    }

    .loader-content {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    /* The Neon Pulse (0xFF34D399) */
    .glow-ring {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(52, 211, 153, 0.1);
      border-radius: 50%;
      border-top: 3px solid #34D399;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
    }

    /* Central Logo/Icon Text */
    .logo-text {
      position: absolute;
      color: #34D399;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }

    /* Loading Bar (Progressive feel) */
    .loading-bar-container {
      width: 200px;
      height: 4px;
      background: #1E293B; /* Matches surfaceDark */
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #14B8A6, #34D399);
      border-radius: 10px;
      animation: progress 2s ease-in-out infinite;
    }

    /* Text (Matches secondaryTextDark) */
    .loading-text {
      margin-top: 20px;
      color: #94A3B8;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes progress {
      0% { width: 0%; transform: translateX(-100%); }
      50% { width: 100%; transform: translateX(0); }
      100% { width: 0%; transform: translateX(100%); }
    }
</style>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>

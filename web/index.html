<style>
    /* Match your AppTheme.backgroundDark (0xFF0F172A) */
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
    }

    .loading-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif; /* Matches your theme */
    }

    .loader-content {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    /* The Neon Pulse (0xFF34D399) */
    .glow-ring {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(52, 211, 153, 0.1);
      border-radius: 50%;
      border-top: 3px solid #34D399;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
    }

    /* Central Logo/Icon Text */
    .logo-text {
      position: absolute;
      color: #34D399;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }

    /* Loading Bar (Progressive feel) */
    .loading-bar-container {
      width: 200px;
      height: 4px;
      background: #1E293B; /* Matches surfaceDark */
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #14B8A6, #34D399);
      border-radius: 10px;
      animation: progress 2s ease-in-out infinite;
    }

    /* Text (Matches secondaryTextDark) */
    .loading-text {
      margin-top: 20px;
      color: #94A3B8;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes progress {
      0% { width: 0%; transform: translateX(-100%); }
      50% { width: 100%; transform: translateX(0); }
      100% { width: 0%; transform: translateX(100%); }
    }
</style>
